<!DOCTYPE html>
<html>
<head>
    <title>Matrícula Escolar Online</title>
</head>
<body>
<h1>Matrícula Escolar Online</h1>
<form>
    <fieldset>
        <legend>Dados Pessoais</legend>
        <label for="nome">Nome completo:</label>
        <input type="text" id="nome" name="nome" required>
        <br>
        <br>
        <label for="data_nascimento">Data de nascimento:</label>
        <input type="date" id="data_nascimento" name="data_nascimento" required>
        <br>
        <br>
        <label for="email">Email do aluno:</label>
        <input type="email" id="email" name="email" placeholder="Nome@exemplo.com" required>
        <br>
        <br>
        <label for="senha">Senha de acesso:</label>
        <input type="password" id="senha" name="senha" placeholder="********" required>
        <br>
        <br>
        <label for="telefone">Telefone de emergência:</label>
        <input type="tel" id="telefone" name="telefone" placeholder="(00) 0000-0000" required>
    </fieldset>
    <fieldset>
        <legend>Preferências de Estudo</legend>
        <p>Áreas de interesse:</p>
        <br>
        <input type="checkbox" id="front_end" name="area" required>
        <label for="front_end">Front End</label>
        <input type="checkbox" id="back_end" name="area">
        <label for="back_end">Back End</label>
        <input type="checkbox" id="design" name="area">
        <label for="design">Design</label>
        <input type="checkbox" id="dados" name="area">
        <label for="dados">Dados</label>
        <br>
        <br>
        <label for="conheceu_escola">Como conheceu a escola?</label>
        <select id="conheceu_escola" name="conheceu_escola" required>
            <option value="">Selecione uma opção</option>
            <option value="instagram">Instagram</option>
            <option value="google">Google</option>
            <option value="indicacao">Indicação</option>
            <option value="outro">Outro</option>
        </select>
    </fieldset>
    <br>
    <button type="submit">Matricular</button>
    <button type="reset">Limpar</button>


</form>

</body>
</html>
